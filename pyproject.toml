[project]
name = "taifeng-stores"
version = "2026.9.29.15"
description = "taifeng 存储适配层 —— 把 MessageStore / ThreadDirectory / MemoryStore 等协议接到 Postgres、Redis、对象存储与向量库"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Taifeng Contributors" },
]
keywords = ["llm", "agent", "storage", "taifeng"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # 只依赖 taifeng 稳定层；具体存储后端的客户端一律走 optional extras（ADR 0001 决策 4）
    "taifeng>=2026.10.1.10",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
]
# 向量记忆只需要数据库装了 pgvector 扩展；客户端仍是 asyncpg
pgvector = [
    "asyncpg>=0.29",
]
redis = [
    "redis>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "asyncpg>=0.29",
    "asyncpg-stubs>=0.29",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taifeng_stores"]
# 迁移脚本是 .sql 文件，随包一起分发

[project.scripts]
taifeng-stores-migrate = "taifeng_stores.postgres.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "S", "B", "C4", "RET", "SIM", "TC"]
# S101(裸 assert)放行：沿用 taifeng 口径——assert 只用于 mypy strict 要求的类型收窄
# (断内部不变量)；外部输入校验一律抛异常，不用 assert。
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# S608(拼接 SQL)：拼进 SQL 的只有表名，来自 SqlNamespace——其字符集在构造时校验为
# [a-z0-9_]；所有取值一律走参数绑定（tests/postgres/test_thread_directory.py 有用例守护）
"src/taifeng_stores/postgres/*.py" = ["S608"]
# S108(硬编码 /tmp)：tests/ 里只允许作占位字符串，真落盘必须用 tmp_path fixture
"tests/**" = ["S108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

# 内核 2026.10.1.10 发布到 PyPI 之前，开发期从同级目录取源码。发布后删掉这一段。
[tool.uv.sources]
taifeng = { path = "../taifeng", editable = true }
